[package]
name = "kwati-gui"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kwati"
path = "src/main.rs"

[dependencies]
kwati-core = { path = "../kwati-core" }
gpui = "=0.2.2"
futures = "0.3"
unicode-segmentation = "1.13"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
