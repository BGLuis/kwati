[package]
name = "kwati-core"
version = "0.1.0"
edition = "2021"

[features]
remote-tests = []
device-tests = []

[dependencies]
dirs = "7.0.0"
ignore = "0.4.34"
keyring-core = "1.0.1"
notify = "8.2.2"
nucleo-matcher = "0.3.1"
russh = "0.65.1"
russh-sftp = "3.0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
smb = { version = "=0.12.1", default-features = false, features = ["multi_threaded", "sign", "encrypt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
suppaftp = { version = "12.2.1", default-features = false, features = ["rustls-ring", "deprecated"] }
sysinfo = "0.40.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-util", "sync", "time"] }
toml = "1.2.1"
trash = "5.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4.0"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
libc = "0.2.191"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WindowsProgramming",
] }
