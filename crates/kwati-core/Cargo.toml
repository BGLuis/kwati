[package]
name = "kwati-core"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "7.0.0"
ignore = "0.4.34"
notify = "8.2.2"
nucleo-matcher = "0.3.1"
toml = "1.2.1"
trash = "5.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
