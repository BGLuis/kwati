[package]
name = "kwati-core"
version = "0.1.0"
edition = "2021"

[features]
remote-tests = []

[dependencies]
dirs = "7.0.0"
ignore = "0.4.34"
keyring-core = "1.0.1"
notify = "8.2.2"
nucleo-matcher = "0.3.1"
russh = "0.65.1"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-util"] }
toml = "1.2.1"
trash = "5.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
